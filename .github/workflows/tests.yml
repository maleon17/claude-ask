name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: python -m py_compile claude_ask.py claude_watcher.py remote_terminal.py
      - run: bash -n setup.sh
      - run: ./scripts/run_tests.sh
